<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#88FF00" />
    </linearGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#3F3F46" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#CCFF00" flood-opacity="0.3" />
    </filter>
  </defs>

  {/* Background Shield Frame */}
  <path d="M 250,30 L 410,90 L 410,260 C 410,360 250,450 250,470 C 250,470 90,360 90,260 L 90,90 Z" fill="#0A0A0A" stroke="url(#primaryGlow)" stroke-width="12" filter="url(#shadow)" />
  <path d="M 250,55 L 390,108 L 390,250 C 390,340 250,425 250,440 C 250,440 110,340 110,250 L 110,108 Z" fill="#141414" stroke="#27272A" stroke-width="4" />

  {/* Dumbbell Icon */}
  <g transform="translate(0, -15)">
    {/* Bar */}
    <rect x="180" y="212" width="140" height="16" rx="4" fill="url(#metallic)" />
    {/* Center Collar */}
    <rect x="235" y="204" width="30" height="32" rx="4" fill="url(#primaryGlow)" />

    {/* Left Plates */}
    <rect x="155" y="172" width="25" height="96" rx="6" fill="url(#metallic)" stroke="#18181B" stroke-width="3" />
    <rect x="135" y="187" width="20" height="66" rx="4" fill="url(#primaryGlow)" />
    <rect x="120" y="202" width="15" height="36" rx="3" fill="url(#metallic)" />

    {/* Right Plates */}
    <rect x="320" y="172" width="25" height="96" rx="6" fill="url(#metallic)" stroke="#18181B" stroke-width="3" />
    <rect x="345" y="187" width="20" height="66" rx="4" fill="url(#primaryGlow)" />
    <rect x="365" y="202" width="15" height="36" rx="3" fill="url(#metallic)" />
  </g>

  {/* Stars */}
  <polygon points="250,110 255,125 270,125 258,135 262,150 250,140 238,150 242,135 230,125 245,125" fill="url(#primaryGlow)" />
  <polygon points="200,120 204,132 216,132 206,140 210,152 200,144 190,152 194,140 184,132 196,132" fill="url(#metallic)" />
  <polygon points="300,120 304,132 316,132 306,140 310,152 300,144 290,152 294,140 284,132 296,132" fill="url(#metallic)" />

  {/* Typography */}
  <text x="250" y="325" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TEAM</text>
  <text x="250" y="375" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="url(#primaryGlow)" text-anchor="middle" letter-spacing="2">IRON FIT</text>
  <text x="250" y="415" font-family="'Inter', 'Arial Black', sans-serif" font-weight="800" font-size="24" fill="#A1A1AA" text-anchor="middle" letter-spacing="6">GYM</text>
</svg>
